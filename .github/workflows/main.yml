name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build with Gradle (Disable KSP Daemon)
      run: ./gradlew assembleDebug -Dksp.useKspDaemon=false -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Aljmal-Store-APK
